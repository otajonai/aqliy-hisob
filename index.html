<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aqliy hisob</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Martian+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one narrow column on grid paper, like a school notebook. The one bold move: huge monospaced numerals. */
  --paper:#f4f6fb; --card:#ffffff; --grid:#e1e7f1; --ink:#0f1b33; --muted:#5b6882; --line:#c9d2e2;
  --accent:#1d3fd8; --ok:#157a3c; --bad:#c42b2b; --okbg:#e3f4ea; --badbg:#fbe6e6;
  --display:'Martian Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0e1627; --card:#15203a; --grid:#17233d; --ink:#e9eefb; --muted:#93a1bf; --line:#2a3a5c;
    --accent:#8aa2ff; --ok:#4ccb83; --bad:#ff7a7a; --okbg:#10301f; --badbg:#3a1618;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1627; --card:#15203a; --grid:#17233d; --ink:#e9eefb; --muted:#93a1bf; --line:#2a3a5c;
  --accent:#8aa2ff; --ok:#4ccb83; --bad:#ff7a7a; --okbg:#10301f; --badbg:#3a1618;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased;touch-action:manipulation;
}
#app{min-height:100%}
.wrap{max-width:480px;margin:0 auto;padding:22px 16px 48px;min-height:100%;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{text-wrap:balance}
.kicker{font:600 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* Home */
.head h1{font:700 24px/1.1 var(--display);letter-spacing:-.04em}
.head p{margin-top:6px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;background:var(--card)}
.stat{padding:12px 14px}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{display:block;font:600 22px var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{border:1.5px solid var(--ink);border-radius:12px;padding:14px;text-align:left;background:var(--card);display:flex;flex-direction:column;gap:4px;min-height:92px}
.act strong{font:600 15px var(--display);letter-spacing:-.03em}
.act span{font-size:13px;color:var(--muted)}
.act.fill{background:var(--ink);color:var(--paper)}
.act.fill span{color:var(--paper);opacity:.75}
.topics{display:flex;flex-direction:column;gap:12px}
.topic{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.thead{display:flex;align-items:center;gap:12px}
.sym{width:40px;height:40px;border-radius:8px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:700 18px var(--display);flex:none}
.tname{flex:1;min-width:0}
.tname strong{display:block;font-size:16px;line-height:1.2}
.tname span{font-size:13px;color:var(--muted)}
.tstars{font:600 12px var(--display);color:var(--muted);white-space:nowrap}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.chip{height:58px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 17px var(--display)}
.chip small{font-size:9px;letter-spacing:1px;color:var(--accent);min-height:11px}
.chip.locked{border-style:dashed;color:var(--muted);background:transparent}
.chip.cur{border:2px solid var(--ink)}
.chip.done{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip.done small{color:var(--paper)}
.foot{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:10px}
.link{color:var(--muted);text-decoration:underline;text-underline-offset:3px;text-align:left;align-self:flex-start}
.row{display:flex;gap:10px;align-items:center}

/* Buttons */
.primary{background:var(--ink);color:var(--paper);border-radius:12px;height:54px;font:600 15px var(--display);letter-spacing:-.02em;width:100%}
.primary:disabled{opacity:.35}
.secondary{border:1.5px solid var(--ink);border-radius:12px;height:54px;font:600 15px var(--display);letter-spacing:-.02em;width:100%;background:var(--card)}
.back{align-self:flex-start;color:var(--muted);font-size:14px;padding:6px 0}

/* Intro */
.intro h1{font:700 26px/1.15 var(--display);letter-spacing:-.04em}
.tip{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.tip p{font-size:15px}
.note{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--muted)}

/* Play */
.bar{display:flex;align-items:center;gap:12px}
.x{width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--card);flex:none}
.prog{flex:1;height:6px;background:var(--grid);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.timer{font:600 14px var(--display);min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.meta{display:flex;justify-content:space-between;gap:8px}
.qwrap{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 0;min-height:130px}
.q{font:600 var(--qs,48px)/1.15 var(--display);letter-spacing:-.04em;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.q.w{font:600 21px/1.4 var(--body);letter-spacing:0;text-wrap:balance}
.ans{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;min-height:68px;border-bottom:2px solid var(--ink);font:600 38px var(--display);letter-spacing:-.03em;padding:0 56px;font-variant-numeric:tabular-nums}
.ans .eq{color:var(--muted)}
.ans.ok{color:var(--ok);border-color:var(--ok)}
.ans.bad{color:var(--bad);border-color:var(--bad)}
.caret{width:2px;height:1em;background:currentColor;animation:blink 1s steps(1) infinite}
.ans.ok .caret,.ans.bad .caret{display:none}
@keyframes blink{50%{opacity:0}}
.del{position:absolute;right:0;top:50%;transform:translateY(-50%);width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:18px}
.fb{min-height:44px;display:flex;align-items:center;justify-content:center;font-size:16px;text-align:center}
.fb.ok{color:var(--ok);font-weight:600}
.fb.bad b{font:700 20px var(--display);color:var(--bad);margin-left:6px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{height:56px;border:1px solid var(--line);border-radius:10px;background:var(--card);font:600 22px var(--display)}
.key:active{background:var(--grid)}
.key:disabled{opacity:.28}
@media (hover:hover) and (pointer:fine){
  .key{height:46px}
  .pad{max-width:320px;width:100%;align-self:center}
}


/* Usul / misol / dars */
.tip ol{padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.tip p b{font-weight:600}
.ex{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.exb{display:flex;flex-direction:column;gap:2px;font:500 13px/1.5 var(--display);letter-spacing:-.02em;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font-variant-numeric:tabular-nums}
.exb b{font-weight:700}
.exb span{white-space:nowrap}
.lessonbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1.5px solid var(--accent);color:var(--accent);border-radius:8px;padding:10px 12px;font-weight:600;font-size:14px;text-align:left}
.lead{font-size:15px;color:var(--muted)}
.ls{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ls h2{font:700 17px/1.25 var(--display);letter-spacing:-.04em}
.ls p{font-size:15px}
.ls ol{padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.cellwrap{display:flex;flex-direction:column;gap:6px}
.cells{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;height:34px}
.cells i{border:1.5px solid var(--ink);border-radius:4px}
.cells i.on{background:var(--accent);border-color:var(--accent)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:600 11px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1.5px solid var(--ink)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{font:600 14px var(--display);white-space:nowrap}
details{border-top:1px solid var(--line);padding:10px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:600;font-size:15px}
details p{margin-top:6px;color:var(--ok);font-weight:600}

/* Result */
.score{font:700 72px/1 var(--display);letter-spacing:-.06em}
.stars{font-size:28px;letter-spacing:6px;color:var(--accent)}
.res h1{font:700 22px/1.2 var(--display);letter-spacing:-.04em}
.miss{list-style:none;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.miss li{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.miss li+li{border-top:1px solid var(--line)}
.miss .qt{font:600 16px var(--display);letter-spacing:-.03em}
.miss .qt.w{font:500 15px var(--body);letter-spacing:0}
.miss .you{font-size:13px;color:var(--muted)}
.miss .you b{color:var(--ok);font-family:var(--display)}
.stack{display:flex;flex-direction:column;gap:10px}
@media (prefers-reduced-motion:reduce){.caret{animation:none}.prog i{transition:none}}

/* ===== Qo'shimchalar: statistika, xotira o'yinlari, effektlar ===== */
:root{--warn:#b26a00;--warnbg:#fff3df}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--warn:#ffb44d;--warnbg:#3a2a10}}
:root[data-theme="dark"]{--warn:#ffb44d;--warnbg:#3a2a10}
.wrap{padding-bottom:calc(48px + env(safe-area-inset-bottom))}
.headrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hbtns{display:flex;gap:8px;flex:none}
.ib{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);display:grid;place-items:center;font-size:17px}
.brain{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:14px 16px;text-align:left}
.brain div{display:flex;flex-direction:column;gap:3px;min-width:0}
.brain strong{font:700 18px/1.2 var(--display);letter-spacing:-.04em}
.brain span.l{font-size:13px;color:var(--muted)}
.brain .arr{font:600 18px var(--display);color:var(--accent)}
.mems{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mem{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px 10px;text-align:left;display:flex;flex-direction:column;gap:5px;min-height:108px}
.mem .ic{font-size:22px;line-height:1}
.mem strong{font:600 13px/1.2 var(--display);letter-spacing:-.03em}
.mem span.s{font-size:12px;color:var(--muted);line-height:1.3}
.mem.hot{border:1.5px solid var(--accent)}
.mem .badge{position:absolute;top:8px;right:8px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--accent);color:var(--card);font:700 12px/22px var(--display);text-align:center}
.syncl{display:inline-flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)}.dot.err{background:var(--bad)}.dot.sync{background:var(--accent);animation:blink 1s steps(1) infinite}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

/* O'yin jarayoni */
.fb{flex-direction:column;gap:2px}
.combo{display:inline-block;margin-left:8px;font:700 14px var(--display);color:var(--warn);animation:pop .4s}
.praise{font:600 13px var(--display);color:var(--accent);animation:pop .4s}
.encs{font-size:13px;color:var(--muted);font-weight:400}
.pop{animation:pop .35s ease-out}
.shake{animation:shake .38s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.hardbox{background:var(--warnbg);border:1px solid var(--warn);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.hard{align-self:flex-start;font:700 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--warn)}

/* Natija */
.stars i{display:inline-block;font-style:normal;animation:starIn .55s both}
.stars i.off{opacity:.35}
.stars.big{font-size:40px}
@keyframes starIn{0%{transform:scale(0) rotate(-50deg);opacity:0}65%{transform:scale(1.35) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.res h1.win{animation:pop .5s .1s both}
.dots10{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;max-width:320px}
.dots10 i{height:12px;border-radius:6px;background:var(--grid);border:1px solid var(--line)}
.dots10 i.on{background:var(--ok);border-color:var(--ok)}
.dots10 i.need{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
.enc{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.enc strong{font:700 15px var(--display);letter-spacing:-.03em}
.enc p{font-size:15px}
.impr{color:var(--ok);font-weight:600}

/* Xotira o'yinlari */
.digit{font:700 112px/1 var(--display);letter-spacing:-.06em;min-height:120px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.digit.flash{animation:pop .3s}
.seqhint{font:600 14px var(--display);color:var(--muted);letter-spacing:.2em}
.grid{display:grid;grid-template-columns:repeat(var(--g),1fr);gap:8px;width:100%;max-width:380px;align-self:center}
.cell{aspect-ratio:1;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:var(--es,34px);line-height:1;display:grid;place-items:center;transition:background .15s}
.cell.hid{background:var(--grid)}
.cell.ok{border-color:var(--ok);background:var(--okbg);animation:pop .3s}
.cell.miss{border-color:var(--bad);border-style:dashed;background:var(--badbg)}
.cell.bad{border-color:var(--bad);animation:shake .35s}
.target{font-size:44px;line-height:1}
.prompt{min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.prompt p{font-size:16px}
.cd{width:100%;height:6px;border-radius:3px;background:var(--grid);overflow:hidden;border:1px solid var(--line)}
.cd i{display:block;height:100%;background:var(--accent);animation:cd linear forwards}
@keyframes cd{from{width:100%}to{width:0}}
.lives{font-size:14px;letter-spacing:2px}

/* Statistika */
.hero{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 16px;display:flex;flex-direction:column;gap:6px}
.hero b{font:700 56px/1 var(--display);letter-spacing:-.06em;color:var(--ok)}
.hero b.neg{color:var(--ink)}
.hero p{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.card h2{font:700 15px/1.25 var(--display);letter-spacing:-.04em}
.card .sub{font-size:13px;color:var(--muted);margin-top:-8px}
.mrow{display:flex;flex-direction:column;gap:6px}
.mrow+.mrow{border-top:1px solid var(--line);padding-top:12px}
.mtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mtop strong{font-size:15px}
.mtop small{color:var(--muted);font-size:12px;display:block;font-weight:400}
.delta{font:700 13px var(--display);white-space:nowrap}
.delta.up{color:var(--ok)}.delta.dn{color:var(--muted)}
.pair{display:grid;grid-template-columns:64px 1fr 60px;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.pair b{font:600 14px var(--display);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.track{height:10px}
.track i{display:block;height:100%;border-radius:0 4px 4px 0;min-width:3px}
.track i.pb{background:var(--line)}
.track i.pa{background:var(--accent)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.chart{position:relative;touch-action:pan-y}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font:500 10px var(--display);fill:var(--muted)}
.tt{position:absolute;transform:translate(-50%,-100%);background:var(--ink);color:var(--paper);border-radius:8px;padding:6px 9px;font-size:12px;pointer-events:none;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:1px}
.tt b{font:700 14px var(--display)}
.tt[hidden]{display:none}
.lastv{font-size:13px;color:var(--muted);margin-top:-6px}.lastv b{font:700 14px var(--display);color:var(--ink)}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--grid);border:1px solid var(--line)}
.heat i.l1,.heat i.l2,.heat i.l3,.heat i.l4{background:var(--accent);border-color:transparent}
.heat i.l1{opacity:.3}.heat i.l2{opacity:.55}.heat i.l3{opacity:.8}
.heat i.fut{visibility:hidden}
.foot2{font-size:12px;color:var(--muted)}
.wrap.play,.wrap.intro,.wrap.res{min-height:100vh;min-height:100dvh}
/* Tez qaror */
.mems.two2{grid-template-columns:1fr 1fr}
.arena{position:relative;width:100%;max-width:340px;aspect-ratio:1;align-self:center;border:1px solid var(--line);border-radius:50%;background:var(--card)}
.arena .cen,.arena .slot{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;border-radius:50%;line-height:1}
.arena .cen{left:50%;top:50%;width:24%;height:24%;font-size:clamp(30px,10vw,46px);font-weight:700;color:var(--muted)}
.arena .slot{width:17%;height:17%;font-size:clamp(22px,7vw,32px)}
.arena .slot.pick{border:1.5px dashed var(--muted);background:var(--paper)}
.arena .slot.ok{background:var(--okbg);border:1.5px solid var(--ok)}
.arena .slot.bad{background:var(--badbg);border:1.5px solid var(--bad)}
.mk{background:repeating-linear-gradient(45deg,var(--ink) 0 3px,transparent 3px 6px),repeating-linear-gradient(-45deg,var(--muted) 0 2px,transparent 2px 7px)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{min-height:76px;border:1.5px solid var(--ink);border-radius:12px;background:var(--card);font:600 16px var(--body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;color:var(--ink)}
.choice .big{font:700 22px var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.choice svg{width:100%;max-width:150px;height:auto;display:block}
.choice.ok{border-color:var(--ok);background:var(--okbg)}
.choice.bad{border-color:var(--bad);background:var(--badbg)}
.dl{height:8px;border-radius:4px;background:var(--grid);border:1px solid var(--line);overflow:hidden}
.dl i{display:block;height:100%;background:var(--warn);animation:cd linear forwards}
.dl i.stop{animation:none;width:0}
.rulec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.rulec b{font:700 20px var(--display);letter-spacing:-.03em}
.rulec span{font:600 16px var(--display);color:var(--muted)}
.rule{font:600 13px var(--display);color:var(--accent);text-align:center}
.qline{font:600 17px/1.3 var(--body);text-align:center}
.evid{font:700 11px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--ok)}
.evid.mid{color:var(--warn)}
.tip small{font-size:12px;color:var(--muted)}
.evid.lo{color:var(--muted)}
.qrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.qrow:first-of-type{border-top:0}
.qrow .ic{font-size:22px;line-height:1.1}
.qrow div{flex:1;display:flex;flex-direction:column;gap:2px}
.qrow b{font:600 14px var(--display);letter-spacing:-.02em}
.qrow small{font-size:13px;color:var(--muted);line-height:1.35}
.lvb{font:700 12px var(--display);color:var(--accent);white-space:nowrap}
.field{width:100%;max-width:290px;aspect-ratio:1;align-self:center;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:6px;color:var(--ink)}
.field svg{width:100%;height:100%;display:block}
.dotk{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:-2px}
.rdk{display:block;width:100%;max-width:290px;aspect-ratio:1;align-self:center;border-radius:50%;border:1px solid var(--line);background:var(--card)}
.rdk.fbx{display:grid;place-items:center;font-size:64px}
.qhead{display:flex;align-items:center;justify-content:center;gap:10px;font:700 22px var(--display);letter-spacing:-.03em}
.qhead span{font-size:40px}
.lvtab{display:flex;flex-direction:column;gap:6px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.lvtab div{display:flex;justify-content:space-between;font-size:14px}
.lvtab b{font:700 14px var(--display);color:var(--accent)}
.chips.c8{grid-template-columns:repeat(8,1fr);gap:5px}
.chips.c8 .chip{height:44px;font-size:15px}
.chip.sel{outline:2.5px solid var(--accent);outline-offset:2px}
.chip:disabled{cursor:default}
.mem .lvbar{display:block;height:4px;border-radius:2px;background:var(--grid);overflow:hidden;margin-top:auto}
.mem .lvbar i{display:block;height:100%;background:var(--accent)}
.kq{font-weight:500;letter-spacing:.02em;text-transform:none;color:var(--muted)}
.mnc{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.mnc .em{font-size:72px;line-height:1.05}
.mnc .em.two{display:flex;align-items:center;gap:14px;font-size:62px}
.mnc .plus{font:700 30px var(--display);color:var(--muted)}
.mnc .nm{font:600 17px var(--display);color:var(--muted)}
.mnc .prev{font:600 14px var(--display);color:var(--muted)}
.mnc .loc{font:700 15px var(--display);color:var(--accent)}
.loc{font:700 14px var(--display);color:var(--accent)}
.dig{font:700 1em var(--display);font-variant-numeric:tabular-nums}
.target.dig{font-size:56px}
.guide{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 14px;font-size:15px;line-height:1.4;max-width:380px;text-align:left}
.route{display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:16px}
.route b{display:inline-block;width:22px;color:var(--accent);font-family:var(--display)}
.opts .cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px}
.opts .cell .nm{font:500 11px/1.1 var(--body);color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opts .cell .no{position:absolute;top:4px;left:6px;font:700 12px var(--display);color:var(--ink)}
.opts .cell.used{opacity:.3}
.numshow{font:700 40px/1.25 var(--display);letter-spacing:.05em;text-align:center;font-variant-numeric:tabular-nums;word-break:break-all;max-width:100%}
.numshow.sm{font-size:32px}
.numshow .okd{color:var(--ok)}.numshow .badd{color:var(--bad);text-decoration:underline}
.pegrow{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:center}
.pegrow span{display:flex;flex-direction:column;align-items:center;gap:2px}
.pegrow b{font:700 34px var(--display)}.pegrow i{font-style:normal;font-size:30px}
.legend10{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;font-size:14px;color:var(--muted)}
.pegtab{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:4px}
.pegtab div{display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 2px}
.pegtab b{font:700 16px var(--display)}.pegtab span{font-size:24px;line-height:1.1}.pegtab small{font-size:10px;color:var(--muted)}
.enc.okb{border-left-color:var(--ok)}
textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:12px/1.4 var(--display);padding:10px;resize:vertical}
@media (prefers-reduced-motion:reduce){.pop,.shake,.cell.ok,.cell.bad,.stars i,.digit.flash,.combo,.praise,.res h1.win{animation:none}.cd i{animation-duration:0s!important}}

/* ===== Sana yordamchilari ===== */
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

/* ===== Holat ===== */
const KEY='aqliy-hisob-v2',OLD='aqliy-hisob-v1';
const fresh=()=>{const t={};TOPICS.forEach(x=>t[x.id]={u:0,s:[0,0,0,0,0],b:[0,0,0,0,0]});
  return{v:2,epoch:0,upd:0,t,speed:0,daily:{date:'',score:0},mem:{ds:0,pm:0,dsn:0,pmn:0,spn:0,uf:0,ufn:0,qd:0,qdn:0,qe:0,qen:0,qm:0,qn:0,qa:0,qp:0,vpa:0,bpa:0,npa:0,vst:0,bst:0,nst:0,vlo:0,blo:0,nlo:0,vch:0,bch:0,nch:0,vpg:0,bpg:0,npg:0},first:{},days:{},rv:{},legacy:{n:0,c:0}}};
const num=x=>+x||0;
function norm(o){
  const r=fresh();if(!o||typeof o!=='object')return r;
  r.epoch=num(o.epoch);r.upd=num(o.upd);
  TOPICS.forEach(x=>{const p=o.t&&o.t[x.id];if(!p)return;const q=r.t[x.id];q.u=Math.min(4,num(p.u));
    for(let i=0;i<5;i++){q.s[i]=num(p.s&&p.s[i]);q.b[i]=num(p.b&&p.b[i])}});
  r.speed=num(o.speed);
  if(o.daily)r.daily={date:String(o.daily.date||''),score:num(o.daily.score)};
  if(o.mem)for(const k in r.mem)r.mem[k]=num(o.mem[k]);
  if(o.first)Object.keys(o.first).sort().forEach(k=>{const v=o.first[k];if(Array.isArray(v))r.first[k]=[num(v[0]),num(v[1])]});
  if(o.days)Object.keys(o.days).sort().forEach(k=>{const d=o.days[k];if(d&&typeof d==='object')r.days[k]=d});
  if(o.rv)Object.keys(o.rv).sort().forEach(k=>{const v=o.rv[k];if(v&&typeof v==='object')r.rv[k]=v});
  if(o.legacy)r.legacy={n:num(o.legacy.n),c:num(o.legacy.c)};
  else if(!o.v&&o.total)r.legacy={n:num(o.total.solved),c:num(o.total.correct)};
  return r;
}
function merge(a,b){
  if(a.epoch!==b.epoch)return a.epoch>b.epoch?a:b;
  const o=fresh();o.epoch=a.epoch;o.upd=Math.max(a.upd,b.upd);
  TOPICS.forEach(x=>{const p=a.t[x.id],q=b.t[x.id];o.t[x.id]={u:Math.max(p.u,q.u),s:p.s.map((v,i)=>Math.max(v,q.s[i])),b:p.b.map((v,i)=>Math.max(v,q.b[i]))}});
  o.speed=Math.max(a.speed,b.speed);
  o.daily=a.daily.date===b.daily.date?{date:a.daily.date,score:Math.max(a.daily.score,b.daily.score)}:(a.daily.date>b.daily.date?a.daily:b.daily);
  const LOW=['uf','qd','qe'],minNZ=(x,y)=>!x?y:!y?x:Math.min(x,y);
  for(const k in o.mem)o.mem[k]=LOW.includes(k)?minNZ(a.mem[k],b.mem[k]):Math.max(a.mem[k],b.mem[k]);
  new Set([...Object.keys(a.first),...Object.keys(b.first)]).forEach(k=>{const x=a.first[k],y=b.first[k];o.first[k]=!x?y:!y?x:(x[1]<=y[1]?x:y)});
  [...new Set([...Object.keys(a.days),...Object.keys(b.days)])].sort().forEach(k=>{
    const x=a.days[k],y=b.days[k];if(!x||!y){o.days[k]=x||y;return}
    const base=(x.n||0)>=(y.n||0)?x:y,d=Object.assign({},base);
    ['ds','pm','sp','mn'].forEach(f=>{const m=Math.max(x[f]||0,y[f]||0);if(m)d[f]=m});
    LOW.forEach(f=>{const m=minNZ(x[f]||0,y[f]||0);if(m)d[f]=m});o.days[k]=d});
  [...new Set([...Object.keys(a.rv),...Object.keys(b.rv)])].sort().forEach(k=>{const x=a.rv[k],y=b.rv[k];o.rv[k]=!x?y:!y?x:((x.at||0)>=(y.at||0)?x:y)});
  o.legacy=a.legacy.n>=b.legacy.n?a.legacy:b.legacy;
  return o;
}
let S=fresh();
try{const r=localStorage.getItem(KEY)||localStorage.getItem(OLD);if(r)S=norm(JSON.parse(r))}catch(e){}

/* ===== Saqlash va bulut sinxroni (Telegram CloudStorage) ===== */
let cloudMeta=null,saving=false,saveAgain=false,saveTimer=null,pulling=false,syncState=CS?'sync':'local';
const csGet=keys=>new Promise((res,rej)=>CS.getItems(keys,(e,v)=>e?rej(e):res(v||{})));
const csSet=(k,v)=>new Promise((res,rej)=>CS.setItem(k,v,(e,ok)=>e?rej(e):res(ok)));
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(immediate){
  S.upd=Date.now();saveLocal();if(!CS)return;
  clearTimeout(saveTimer);saveTimer=null;
  if(immediate)cloudPush();else saveTimer=setTimeout(()=>{saveTimer=null;cloudPush()},2500);
}
async function cloudPush(){
  if(!CS)return;if(saving){saveAgain=true;return}
  saving=true;setSync('sync');
  try{
    const str=JSON.stringify(S),n=Math.max(1,Math.ceil(str.length/CH)),g=cloudMeta&&cloudMeta.g==='a'?'b':'a';
    await Promise.all(Array.from({length:n},(_,i)=>csSet(g+i,str.slice(i*CH,(i+1)*CH))));
    const m={g,n,u:S.upd,e:S.epoch};await csSet('meta',JSON.stringify(m));cloudMeta=m;setSync('ok');
  }catch(e){setSync('err')}
  saving=false;if(saveAgain){saveAgain=false;cloudPush()}
}
async function cloudPull(){
  const m0=await csGet(['meta']);if(!m0.meta)return null;
  const m=JSON.parse(m0.meta),keys=Array.from({length:m.n},(_,i)=>m.g+i);let str='';
  for(let i=0;i<keys.length;i+=16){const part=keys.slice(i,i+16),r=await csGet(part);part.forEach(k=>str+=r[k]||'')}
  cloudMeta=m;return norm(JSON.parse(str));
}
async function sync(){
  if(!CS){setSync('local');return}
  if(pulling||saving)return;pulling=true;setSync('sync');
  try{
    const cloud=await cloudPull();pulling=false;
    if(!cloud){await cloudPush();return}
    const before=JSON.stringify(S);
    S=norm(merge(S,cloud));saveLocal();
    const after=JSON.stringify(S);
    if(after!==JSON.stringify(cloud))await cloudPush();else setSync('ok');
    if(after!==before&&(scr==='home'||scr==='stats'))scr==='home'?renderHome():renderStats();
  }catch(e){pulling=false;setSync('err')}
}
function syncHtml(){
  const t={local:"Natijalar shu qurilmada saqlanadi. Telegram'da ochilsa — bulut orqali sinxron.",ok:'Bulut bilan sinxron (telefon va PC)',sync:'Sinxronlanmoqda…',err:'Sinxron vaqtincha ishlamadi — keyinroq qayta urinadi'}[syncState];
  return `<i class="dot ${syncState}"></i><span>${t}</span>`;
}
function setSync(st){syncState=st;const el=$('#sync');if(el)el.innerHTML=syncHtml()}

  if(document.hidden){if(saveTimer){clearTimeout(saveTimer);saveTimer=null;cloudPush()}}
  else if(!ses&&!mg)sync();

/* ===== Ovoz va tebranish ===== */
let snd=true;try{snd=localStorage.getItem('ah-snd')!=='0'}catch(e){}
let AC=null;
function beep(notes){
  if(!snd)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    let t=AC.currentTime+.01;
    notes.forEach(([f,d,type,v])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v||.12,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03);t+=d*.75});
  }catch(e){}
}

  ok:()=>beep([[660,.1],[990,.16]]),

/* ===== Konfetti (yengil canvas) ===== */
let fxRun=0;
function confetti(power){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#fx'),x=c.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1),W=innerWidth,H=innerHeight;
  c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
  const cols=['#1d3fd8','#f5b700','#e8467c','#21a366','#8a5cf6','#ff7a1a','#14b8c4'];
  const N=Math.round(70*power),P=[];
  for(let i=0;i<N;i++){const left=i%2===0;P.push({x:left?-10:W+10,y:H*.72,vx:(left?1:-1)*(3+Math.random()*6)*Math.min(1.3,.75+power*.25),vy:-(8+Math.random()*9),r:Math.random()*Math.PI,vr:(Math.random()-.5)*.35,w:5+Math.random()*5,h:8+Math.random()*7,c:cols[i%cols.length]})}
  const id=++fxRun,t0=performance.now();
  (function f(t){
    if(id!==fxRun)return;const e=t-t0;x.clearRect(0,0,W,H);
    P.forEach(p=>{p.vy+=.32;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.max(0,1-e/2600);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2)));x.restore()});
    if(e<2600)requestAnimationFrame(f);else x.clearRect(0,0,W,H);
  })(t0);
}

const actDay=k=>{const d=S.days[k];return!!d&&((d.n||0)>0||d.ds||d.pm||d.uf||d.qd||d.qe||d.mn)};

  const a=d.tp[q.topic]||(d.tp[q.topic]=[0,0,0]);a[0]++;if(ok)a[1]++;a[2]=r1(a[2]+secs);

const RV_INT=[1,3,7,14,30];
const activeRv=()=>Object.entries(S.rv).filter(([k,v])=>!v.done);
const dueList=()=>activeRv().filter(([k,v])=>v.due<=today()).sort((a,b)=>a[1].due<b[1].due?-1:1);
function rvUpdate(q,ok,isRev){
  const k=q.rk||(q.topic+'|'+q.lv+'|'+q.t),it=S.rv[k];
  if(isRev&&it){if(ok){it.box++;if(it.box>=RV_INT.length)it.done=1;else it.due=addDays(RV_INT[it.box])}else{it.box=0;it.due=addDays(1)}it.at=Date.now();return}
  if(!ok){S.rv[k]={t:q.t,a:q.a,topic:q.topic,lv:q.lv,neg:q.neg?1:0,dec:q.dec?1:0,w:q.w?1:0,box:0,due:addDays(1),at:Date.now()};pruneRv()}
}
function pruneRv(){
  const old=Date.now()-30*864e5;
  for(const k in S.rv){const v=S.rv[k];if(v.done&&v.at<old)delete S.rv[k]}
  const act=activeRv().sort((a,b)=>a[1].at-b[1].at);
  while(act.length>80){delete S.rv[act.shift()[0]]}
}

function windowsCalc(){
  const ks=Object.keys(S.days).filter(k=>(S.days[k].n||0)>0).sort();
  const agg=keys=>{const o={n:0,c:0,ts:0,tp:{},days:keys};keys.forEach(k=>{const d=S.days[k];o.n+=d.n||0;o.c+=d.c||0;o.ts+=d.ts||0;
    for(const t in d.tp||{}){const a=o.tp[t]||(o.tp[t]=[0,0,0]);a[0]+=d.tp[t][0];a[1]+=d.tp[t][1];a[2]+=d.tp[t][2]||0}});return o};
  const MIN=30;let bi=0,bn=0;while(bi<ks.length&&bn<MIN&&bi<5){bn+=S.days[ks[bi]].n;bi++}
  let ri=ks.length,rn=0;while(ri>bi&&rn<MIN&&ks.length-ri<7){ri--;rn+=S.days[ks[ri]].n}
  const recent=ri<ks.length?agg(ks.slice(ri)):null;
  return{ks,base:agg(ks.slice(0,bi)),recent:recent&&recent.n>=10?recent:null};
}
function metrics(){
  const w=windowsCalc(),m=[];
  if(w.base.n>=5){
    const b=w.base,r=w.recent;
    m.push({id:'acc',name:'Aniqlik',sub:"to'g'ri javoblar ulushi",unit:'%',b:Math.round(b.c/b.n*100),a:r?Math.round(r.c/r.n*100):null,hi:true});
    m.push({id:'spd',name:'Tezlik',sub:'soniya bir savolga · kamroq — yaxshi',unit:' s',b:r1(b.ts/b.n),a:r?r1(r.ts/r.n):null,hi:false});
  }
  const f=S.first,mm=S.mem,r2=v=>Math.round(v*100)/100;
  if(f.qe)m.push({id:'qe',name:'Qaror tezligi',sub:'bitta qarorga ketgan vaqt · kamroq — yaxshi',unit:' s',b:r2(f.qe[0]/1000),a:mm.qen>1?r2(mm.qe/1000):null,hi:false});
  if(f.uf)m.push({id:'uf',name:"Tezkor ko'rish",sub:"ilg'ay olingan eng qisqa vaqt · kamroq — yaxshi",unit:' ms',b:f.uf[0],a:mm.ufn>1?mm.uf:null,hi:false});
  if(f.sp)m.push({id:'sp',name:'60 soniya',sub:"bir daqiqada to'g'ri javoblar",unit:' ta',b:f.sp[0],a:mm.spn>1?S.speed:null,hi:true});
  if(f.ds)m.push({id:'ds',name:'Raqam xotirasi',sub:'eslab qolingan raqamlar soni',unit:' ta',b:f.ds[0],a:mm.dsn>1?mm.ds:null,hi:true});
  if(f.pm)m.push({id:'pm',name:'Rasm xotirasi',sub:'erishilgan daraja',unit:'-d.',b:f.pm[0],a:mm.pmn>1?mm.pm:null,hi:true});
  MNG.forEach(g=>{const D=MN[g],k=D.k;if(f['b'+k])m.push({id:k,name:D.t,sub:D.msub,unit:' ta',b:f['b'+k][0],a:mm['n'+k]>1?mm['b'+k]:null,hi:true})});
  m.forEach(x=>{x.d=x.a==null||!x.b?null:Math.round((x.hi?(x.a-x.b):(x.b-x.a))/x.b*100)});
  const ds=m.filter(x=>x.d!=null).map(x=>x.d);
  return{w,m,avg:ds.length?Math.round(ds.reduce((a,b)=>a+b,0)/ds.length):null};
}

/* ===== Mashq sessiyasi ===== */
function startSession(opts){
  clearAll();
  lastOpts=opts;
  ses=Object.assign({idx:0,correct:0,combo:0,wrong:[],times:[],input:'',state:'ask',ok:false,ended:false},opts);
  ses.startTs=Date.now();ses.cur=nextQ();ses.qTs=Date.now();
  enableClose(true);
  renderPlay();
  ses.iv=setInterval(tick,250);tick();
}
function nextQ(){
  if(ses.kind==='review')return ses.items[ses.idx];
  if(ses.kind==='level')return makeQ(ses.topic,ses.level);
  const pool=TOPICS.filter(t=>!(ses.kind==='speed'&&t.id==='life'));
  const t=pick(pool),u=S.t[t.id].u;
  return makeQ(t.id,Math.random()<.5?u:rnd(0,u));
}
function renderPlay(){
  setScreen('play');
  const q=ses.cur,len=q.t.length;
  const qs=q.w?'':(len<=9?52:len<=12?44:len<=16?34:28);
  const pct=ses.kind==='speed'?100:ses.idx/ses.total*100;
  const label=ses.kind==='level'?`${ses.topicName} · ${ses.level+1}-daraja`:ses.kind==='review'?`Takrorlash · ${q.topicName}`:`${q.topicName} · ${q.lv+1}`;
  const count=ses.kind==='speed'?`To'g'ri: ${ses.correct}`:`${ses.idx+1} / ${ses.total}`;
  const keys=['7','8','9','4','5','6','1','2','3','-','0','.'];
  const pad=keys.map(k=>{
    const dis=(k==='-'&&!q.neg)||(k==='.'&&!q.dec);
    const lab=k==='-'?'±':k==='.'?',':k;
    return `<button class="key" data-act="key" data-k="${k}" ${dis?'disabled':''} ${k==='-'?'aria-label="Minus ishorasi"':k==='.'?'aria-label="Vergul"':''}>${lab}</button>`;
  }).join('');
  app.innerHTML=`<div class="wrap play">
    <div class="bar"><button class="x" data-act="exit" aria-label="Chiqish">✕</button><div class="prog"><i id="pbar" style="width:${pct}%"></i></div><div class="timer" id="timer"></div></div>
    <div class="meta"><span class="kicker">${label}</span><span class="kicker">${count}</span></div>
    <div class="qwrap"><div class="q ${q.w?'w':''}" ${qs?`style="--qs:${qs}px"`:''}>${q.t}</div></div>
    <div class="ans" id="ans">${q.w?'':'<span class="eq">=</span>'}<span id="aval"></span><span class="caret"></span><button class="del" data-act="del" aria-label="O'chirish">⌫</button></div>
    <div class="fb" id="fb" aria-live="polite"></div>
    <div class="pad">${pad}</div>
    <button class="primary" id="main" data-act="submit">Tekshirish</button>
  </div>`;
  tick();
}
function tick(){
  if(!ses||ses.ended)return;
  const el=$('#timer');if(!el)return;
  const e=(Date.now()-ses.startTs)/1000;
  if(ses.kind==='speed'){
    el.textContent=Math.max(0,Math.ceil(ses.limit-e))+' s';
    const b=$('#pbar');if(b)b.style.width=Math.max(0,100-e/ses.limit*100)+'%';
    if(e>=ses.limit)finish();
  }else el.textContent=mmss(e);
}
function updateAns(){const el=$('#aval');if(el)el.textContent=showNum(ses.input)}
function press(k){
  if(!ses||ses.ended||ses.state!=='ask')return;
  const q=ses.cur;let s=ses.input;
  if(k==='del')s=s.slice(0,-1);
  else if(k==='-'){if(q.neg)s=s.startsWith('-')?s.slice(1):'-'+s}
  else if(k==='.'||k===','){if(q.dec&&!s.includes('.'))s+=(s===''||s==='-')?'0.':'.'}
  else if(/^\d$/.test(k)){if(s.replace(/[-.]/g,'').length<9)s+=k}
  ses.input=s;updateAns();
}
function submit(){
  if(!ses||ses.ended||ses.state!=='ask')return;
  const s=ses.input;if(!s||s==='-'||s==='.'||s==='-0.')return;
  const q=ses.cur,v=parseFloat(s),ok=Math.abs(v-q.a)<1e-6,secs=(Date.now()-ses.qTs)/1000;
  ses.times.push(secs);
  recordAnswer(q,ok,secs);
  rvUpdate(q,ok,ses.kind==='review');
  if(ok){ses.correct++;ses.combo++}else{ses.wrong.push({q,given:s});ses.combo=0}
  save();
  ses.state='fb';ses.ok=ok;
  const ans=$('#ans'),fb=$('#fb'),main=$('#main');
  ans.classList.add(ok?'ok':'bad',ok?'pop':'shake');
  fb.className='fb '+(ok?'ok':'bad');
  const hard=ses.kind==='level'&&(ses.level>=3||ses.challenge);
  if(ok){
    const c=ses.combo;
    fb.innerHTML=`<span>To'g'ri${c>=3?`<span class="combo">🔥 ${c} ketma-ket</span>`:''}</span>${c===5||c===8||c===10||c===15||c===20?`<span class="praise">${pick(PRAISE)}</span>`:''}`;
    SFX.ok();hap('ok');
  }else{
    fb.innerHTML=`<span>To'g'ri javob:<b>${ansStr(q.a)}</b></span>${hard&&ses.kind!=='speed'?`<span class="encs">${pick(HARD_ENC)}</span>`:''}`;
    SFX.bad();hap('bad');
  }
  if(ok){main.disabled=true;ses.timer=setTimeout(advance,ses.kind==='speed'?280:460)}
  else if(ses.kind==='speed')ses.timer=setTimeout(advance,900);
  else{main.textContent='Keyingisi';main.dataset.act='next'}
}
function advance(){
  if(!ses||ses.ended)return;
  clearTimeout(ses.timer);
  ses.idx++;
  if(ses.kind!=='speed'&&ses.idx>=ses.total)return finish();
  ses.cur=nextQ();ses.input='';ses.state='ask';ses.qTs=Date.now();
  renderPlay();
}
function finish(){
  if(!ses||ses.ended)return;
  ses.ended=true;clearInterval(ses.iv);clearTimeout(ses.timer);
  const r={kind:ses.kind,correct:ses.correct,answered:ses.times.length,total:ses.total,wrong:ses.wrong,
    avg:ses.times.length?ses.times.reduce((a,b)=>a+b,0)/ses.times.length:0,opts:lastOpts};
  if(ses.kind==='level'){
    const p=S.t[ses.topic],need=ses.challenge?9:8;
    r.passed=ses.correct>=need;r.need=need;r.topic=ses.topic;r.level=ses.level;r.prevBest=p.b[ses.level];
    p.b[ses.level]=Math.max(p.b[ses.level],ses.correct);
    if(r.passed){
      r.stars=ses.correct===10?3:ses.correct===9?2:1;
      r.firstPass=!p.s[ses.level];r.newStars=r.stars>p.s[ses.level];
      p.s[ses.level]=Math.max(p.s[ses.level],r.stars);
      p.u=Math.max(p.u,Math.min(4,ses.level+1));
    }
  }else if(ses.kind==='daily'){
    S.daily={date:today(),score:ses.correct};
  }else if(ses.kind==='speed'){
    r.prev=S.speed;r.record=ses.correct>S.speed;if(r.record)S.speed=ses.correct;
    setFirst('sp',ses.correct);if(ses.correct>0){S.mem.spn++;dayMax('sp',ses.correct)}
  }else if(ses.kind==='review'){r.moreDue=0}
  save(true);ses=null;enableClose(false);
  if(r.kind==='review')r.moreDue=dueList().length;
  renderResult(r);
  celebrate(r);
}
function celebrate(r){
  let p=0;
  if(r.kind==='level'&&r.passed){p=r.stars===3?1.7:r.stars===2?1.2:.9;(r.stars===3?SFX.big:SFX.win)()}
  else if(r.kind==='daily'&&r.correct>=8){p=r.correct===10?1.4:1;SFX.win()}
  else if(r.kind==='speed'&&r.record&&r.correct>0){p=1.3;SFX.big()}
  else if(r.kind==='review'&&r.correct===r.total){p=.8;SFX.win()}
  if(p){hap('ok');setTimeout(()=>confetti(p),120)}
}
function encourage(r){
  const gap=r.need-r.correct,hard=r.level>=3||r.need===9;let h,p;
  if(gap<=1){h='Atigi 1 ta yetmadi';p="Siz bu darajaga deyarli tayyorsiz. Yana bir urinish — va albatta o'tasiz."}
  else if(gap<=3){h="Miya o'rganyapti";p="Usulni yana bir ko'rib chiqing va shoshilmasdan, aniq yeching. Tezlik keyin o'zi keladi."}
  else{h=hard?'Bu qiyin daraja — va bu yaxshi':'Bu yerda biroz mashq kerak';p="Miya aynan qiyinchilikda o'sadi: xato qilish — o'rganishning bir qismi. Avval usulni o'qing, keyin qayta urinib ko'ring."}
  const imp=r.prevBest>0&&r.correct>r.prevBest?`<p class="impr">📈 Oldingi eng yaxshi natijangizdan +${r.correct-r.prevBest} ta yaxshiroq!</p>`:'';
  const rv=r.wrong.length?`<p class="muted" style="font-size:14px">Xato misollar «Takrorlash»ga qo'shildi — ertaga yana so'raladi va esda mustahkam qoladi.</p>`:'';
  return `<div class="enc"><strong>💪 ${h}</strong><p>${p}</p>${imp}${rv}</div>`;
}
function renderResult(r){
  setScreen('result');
  let title,big,extra='',win=false;
  const frac=`${r.correct}<span class="muted" style="font-size:.5em">/${r.total}</span>`;
  if(r.kind==='level'){
    big=frac;
    if(r.passed){win=true;title=r.stars===3?'Mukammal! 🎉':"Daraja o'tildi! 🎉";
      extra=`<div class="stars big" aria-label="${r.stars} yulduz">${starsAnim(r.stars)}</div>`+(r.firstPass&&r.level<4?`<p class="muted">${r.level+2}-daraja ochildi.</p>`:'')+(r.prevBest&&r.correct>r.prevBest&&!r.firstPass?`<p class="impr">📈 Yangi shaxsiy rekord: ${r.correct}/10</p>`:'');}
    else{const gap=r.need-r.correct;title=gap<=1?'Juda yaqin edi!':gap<=3?'Yaqinlashyapsiz':"Hali o'tilmadi";
      extra=`<div class="dots10" role="img" aria-label="${r.correct} ta to'g'ri, ${r.need} ta kerak">${Array.from({length:10},(_,i)=>`<i class="${i<r.correct?'on':''} ${i===r.need-1?'need':''}"></i>`).join('')}</div><p class="muted">O'tish uchun ${r.need} ta to'g'ri kerak — yana ${gap} ta.</p>`+encourage(r);}
  }else if(r.kind==='daily'){
    big=frac;win=r.correct>=8;title=r.correct===10?'Mukammal kun! 🎉':win?'Ajoyib kun! 🎉':'Kunlik mashq tugadi';
    if(!win)extra=`<p class="muted">Har kungi mashq — miyaning eng yaxshi «sport zali». Ertaga yana keling${r.wrong.length?', xatolar «Takrorlash»da kutadi':''}.</p>`;
  }else if(r.kind==='review'){
    big=frac;win=r.correct===r.total;title=win?'Hammasi esda! 🎉':'Takrorlash tugadi';
    extra=`<p class="muted">${r.correct} ta misol keyingi bosqichga o'tdi — endi uzoqroq vaqtdan keyin so'raladi.${r.total-r.correct?` ${r.total-r.correct} tasi ertaga yana so'raladi.`:''}</p>`;
  }else{
    win=r.record&&r.correct>0;title=win?'Yangi rekord! 🎉':'Vaqt tugadi';big=`${r.correct}`;
    extra=`<p class="muted">${r.answered} ta javobdan ${r.correct} tasi to'g'ri. Rekord: ${Math.max(r.prev,r.correct)}.</p>`+(!win&&r.prev?`<p class="muted">Rekordgacha ${r.prev-r.correct+1} ta qoldi.</p>`:'');
  }
  const miss=r.wrong.length?`<div><div class="kicker" style="margin-bottom:8px">Xatolar (${r.wrong.length})</div><ul class="miss">${r.wrong.slice(0,12).map(w=>`<li><span class="qt ${w.q.w?'w':''}">${w.q.t}${w.q.w?'':' ='}</span><span class="you">To'g'ri: <b>${ansStr(w.q.a)}</b> · Sizniki: ${showNum(w.given)}</span></li>`).join('')}</ul></div>`:'';
  const hasNext=r.kind==='level'&&r.passed&&r.level<4;
  let btns;
  if(r.kind==='level'&&!r.passed)btns=`<button class="primary" data-act="retry">Yana bir urinish 💪</button><button class="secondary" data-act="chip" data-t="${r.topic}" data-l="${r.level}">Usulni ko'rish</button>`;
  else if(hasNext)btns=`<button class="primary" data-act="nextlevel" data-t="${r.topic}" data-l="${r.level+1}">Keyingi daraja</button><button class="secondary" data-act="retry">Qayta o'ynash</button>`;
  else if(r.kind==='review')btns=r.moreDue?`<button class="primary" data-act="reviewgo">Davom etish (${r.moreDue} ta)</button>`:'';
  else btns=`<button class="primary" data-act="retry">${r.kind==='level'?"Qayta o'ynash":'Yana bir marta'}</button>`;
  btns+=`<button class="link" data-act="home" style="align-self:center">Bosh sahifa</button>`;
  lastOpts=r.opts;
  const kick=r.kind==='level'?topicById(r.topic).name+' · '+(r.level+1)+'-daraja':r.kind==='daily'?'Kunlik mashq':r.kind==='review'?'Takrorlash':'60 soniya';
  app.innerHTML=`<div class="wrap res">
    <div class="stack" style="margin-top:8px"><div class="kicker">${kick}</div><h1 class="${win?'win':''}">${title}</h1></div>
    <div class="score" aria-label="Natija">${big}</div>
    ${extra}
    ${r.answered?`<p class="muted">O'rtacha ${r.avg.toFixed(1).replace('.',',')} soniya bir savolga.</p>`:''}
    ${miss}
    <div class="stack" style="margin-top:auto">${btns}</div>
  </div>`;
  window.scrollTo(0,0);
}

/* ===== Raqam xotirasi (digit span) ===== */
function renderSpanIntro(){
  clearAll();setScreen('mem');
  app.innerHTML=`<div class="wrap intro">
    <button class="back" data-act="home">← Orqaga</button>
    <div><div class="kicker">Xotira mashqi</div><h1 style="margin-top:8px">Raqam xotirasi</h1></div>
    <div class="tip"><span class="kicker">Qanday o'ynaladi</span><ol><li>Ekranda raqamlar birin-ketin chiqadi.</li><li>Ular yo'qolgach, xuddi shu tartibda yozing.</li><li>To'g'ri bo'lsa, keyingi safar 1 ta raqam ko'payadi. Har uzunlikda 2 ta imkoniyat.</li></ol></div>
    <div class="tip"><span class="kicker">Maslahat</span><p>Raqamlarni guruhlab, ichingizda takrorlang: 4 8 2 7 1 → «48 – 27 – 1». Bu «guruhlash» (chunking) deyiladi va bir vaqtda ko'proq narsani eslab qolishga yordam beradi.</p></div>
    <div class="note">Rekord: ${S.mem.ds?S.mem.ds+' ta raqam':'—'}. Kattalarda o'rtacha 6–8 ta.</div>
    <button class="primary" data-act="spanstart" style="margin-top:auto">Boshlash</button>
  </div>`;
}
function spanStart(){clearAll();mg={kind:'span',len:3,tries:0,best:0,input:'',phase:'show',seq:[],tm:[]};enableClose(true);spanRound()}
function spanRound(){
  const m=mg,L=m.len,seq=[];while(seq.length<L){const d=rnd(0,9);if(d!==seq[seq.length-1])seq.push(d)}
  m.seq=seq;m.input='';m.phase='show';m.msg='';renderSpan();
  let i=0;
  const step=()=>{if(m.dead||m.phase!=='show')return;const el=$('#digit');if(!el)return;
    if(i>=L){el.textContent='';m.tm.push(setTimeout(()=>{if(m.dead)return;m.phase='input';renderSpan()},300));return}
    el.textContent=seq[i];el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');SFX.tick();i++;
    m.tm.push(setTimeout(()=>{if(m.dead)return;el.textContent='';m.tm.push(setTimeout(step,220))},780))};
  m.tm.push(setTimeout(step,650));
}
function renderSpan(){
  setScreen('mem');
  const m=mg,ph=m.phase,lives='●'.repeat(2-m.tries)+'○'.repeat(m.tries);
  const keys=['1','2','3','4','5','6','7','8','9','','0','del'];
  const pad=keys.map(k=>k===''?'<span></span>':`<button class="key" data-act="skey" data-k="${k}" ${ph!=='input'?'disabled':''} ${k==='del'?`aria-label="O'chirish"`:''}>${k==='del'?'⌫':k}</button>`).join('');
  let mid;
  if(ph==='show')mid=`<div class="qwrap"><div class="digit" id="digit" aria-live="polite"></div></div><div class="fb"><span class="seqhint">ESLAB QOLING…</span></div>`;
  else mid=`<div class="qwrap"><div class="digit" style="font-size:${m.len>8?40:m.len>6?52:64}px;letter-spacing:.08em;color:${ph==='fb'?(m.ok?'var(--ok)':'var(--bad)'):'inherit'}">${m.input||'<span class="muted">?</span>'}</div></div>
    <div class="fb ${ph==='fb'?(m.ok?'ok':'bad'):''}" aria-live="polite">${ph==='input'?`<span class="muted">${m.len} ta raqamni tartib bilan yozing</span>`:m.msg}</div>`;
  const btn=ph==='input'?`<button class="primary" data-act="spancheck" ${m.input.length!==m.len?'disabled':''}>Tekshirish</button>`:ph==='fb'&&!m.ok?`<button class="primary" data-act="spannext">${m.tries>=2?'Natijani ko\'rish':'Yana urinish'}</button>`:`<button class="primary" disabled>${ph==='show'?'Kuzating…':'Barakalla!'}</button>`;
  app.innerHTML=`<div class="wrap play">
    <div class="bar"><button class="x" data-act="exit" aria-label="Chiqish">✕</button><div class="meta" style="flex:1"><span class="kicker">Raqam xotirasi · ${m.len} ta</span><span class="kicker lives" aria-label="Imkoniyatlar">${lives}</span></div></div>
    ${mid}<div class="pad">${pad}</div>${btn}
  </div>`;
}
function spanKey(k){
  const m=mg;if(!m||m.kind!=='span'||m.phase!=='input')return;
  if(k==='del')m.input=m.input.slice(0,-1);else if(/^\d$/.test(k)&&m.input.length<m.len)m.input+=k;
  renderSpan();
}
function spanCheck(){
  const m=mg;if(!m||m.phase!=='input'||m.input.length!==m.len)return;
  m.ok=m.input===m.seq.join('');m.phase='fb';
  if(m.ok){m.best=m.len;m.msg=`<span>To'g'ri! Endi ${m.len+1} ta raqam</span>${m.len+1>Math.max(S.mem.ds,6)?'<span class="praise">Rekord hududi!</span>':''}`;SFX.ok();hap('ok');renderSpan();
    m.tm.push(setTimeout(()=>{if(m.dead)return;m.len++;m.tries=0;spanRound()},1100))}
  else{m.tries++;m.msg=`<span>To'g'ri ketma-ketlik:<b>${m.seq.join(' ')}</b></span>`;SFX.bad();hap('bad');renderSpan()}
}
function spanNext(){const m=mg;if(!m)return;if(m.tries>=2)return spanEnd();spanRound()}
function spanEnd(){
  const m=mg,score=m.best,prev=S.mem.ds;clearAll();enableClose(false);
  if(score>0){setFirst('ds',score);S.mem.dsn++;dayMax('ds',score)}
  const rec=score>prev;S.mem.ds=Math.max(prev,score);save(true);
  renderMemResult({name:'Raqam xotirasi',score,unit:'ta raqam',rec,prev,first:S.first.ds,again:'spanstart',
    tip:rec?'':`Rekordgacha ${prev-score+1} ta qoldi. Raqamlarni 2–3 tadan guruhlab, ichingizda «ovoz chiqarib» takrorlang.`});
}

/* ===== Rasm xotirasi (rasm va joy) ===== */
const EMO=['🍎','🍌','🍇','🍓','🍒','🍋','🥕','🌽','🍄','🌵','🌻','🌙','⭐','⚡','🔥','❄️','🎈','🎁','🎲','🎸','⚽','🏀','🚗','🚲','✈️','🚀','⏰','🔑','📚','✏️','🎩','👓','🐱','🐶','🐟','🐢','🦋','🐝','🐘','🦉'];
const picCfg=L=>{const k=Math.min(L+2,14),g=k<=4?3:k<=9?4:5;return{k,g,ms:Math.min(1500+k*850,13000)}};
function renderPicsIntro(){
  clearAll();setScreen('mem');
  app.innerHTML=`<div class="wrap intro">
    <button class="back" data-act="home">← Orqaga</button>
    <div><div class="kicker">Xotira mashqi</div><h1 style="margin-top:8px">Rasm xotirasi</h1></div>
    <div class="tip"><span class="kicker">Qanday o'ynaladi</span><ol><li>Rasmlar katakchalarda bir necha soniya ko'rinadi.</li><li>Keyin ular yopiladi va «🍎 qayerda edi?» deb so'raladi — o'sha katakni bosing.</li><li>Hammasini xatosiz topsangiz — keyingi daraja, rasmlar ko'payadi. 3 ta jon bor.</li></ol></div>
    <div class="tip"><span class="kicker">Maslahat</span><p>Har bir rasmni joyi bilan bog'lab, kichik hikoya to'qing: «olma burchakda turibdi, mushuk o'rtada uxlayapti». Bu «xotira saroyi» (joylar usuli) — xotira chempionlari ishlatadigan usulning soddalashgan ko'rinishi.</p></div>
    <div class="note">Rekord: ${S.mem.pm?S.mem.pm+'-daraja':'—'}</div>
    <button class="primary" data-act="picstart" style="margin-top:auto">Boshlash</button>
  </div>`;
}
function picsStart(){clearAll();mg={kind:'pics',L:1,lives:3,best:0,tm:[]};enableClose(true);picsRound()}
function picsRound(){
  const m=mg,c=picCfg(m.L);
  const cells=shuffle([...Array(c.g*c.g).keys()]).slice(0,c.k),em=shuffle(EMO.slice()).slice(0,c.k);
  m.c=c;m.items=cells.map((cell,i)=>({cell,e:em[i]}));m.order=shuffle(m.items.slice());m.ai=0;m.mist=0;m.st={};m.bad=-1;m.phase='show';m.msg='';
  renderPics();
  m.tm.push(setTimeout(()=>{if(!m.dead&&m.phase==='show'){m.phase='ask';renderPics()}},c.ms));
}
function renderPics(){
  setScreen('mem');
  const m=mg,c=m.c,ph=m.phase,at={};m.items.forEach(x=>at[x.cell]=x.e);
  const hearts='❤️'.repeat(m.lives)+'🤍'.repeat(3-m.lives);
  const cells=Array.from({length:c.g*c.g},(_,i)=>{
    let cls='cell',inner='';
    if(ph==='show'){if(at[i]){inner=at[i];cls+=' show'}}
    else{cls+=' hid';if(m.st[i]==='ok'){inner=at[i];cls='cell ok'}else if(m.st[i]==='miss'){inner=at[i];cls='cell miss'}if(i===m.bad)cls+=' bad'}
    return `<button class="${cls}" data-act="cell" data-i="${i}" ${ph!=='ask'?'tabindex="-1"':''} aria-label="Katak ${i+1}">${inner}</button>`;
  }).join('');
  let prompt;
  if(ph==='show')prompt=`<p>Eslab qoling: <b>${c.k} ta rasm</b></p><div class="cd"><i style="animation-duration:${c.ms}ms"></i></div>`;
  else if(ph==='ask'){const t=m.order[m.ai];prompt=`<div class="target">${t.e}</div><p>qayerda edi? <span class="muted">(${m.ai+1}/${c.k})</span></p>`}
  else prompt=m.msg;
  const btn=ph==='show'?`<button class="secondary" data-act="picready">Tayyorman</button>`:ph==='fb'&&m.next?`<button class="primary" data-act="picnext">${m.lives<=0?"Natijani ko'rish":'Davom etish'}</button>`:'';
  app.innerHTML=`<div class="wrap play">
    <div class="bar"><button class="x" data-act="exit" aria-label="Chiqish">✕</button><div class="meta" style="flex:1"><span class="kicker">Rasm xotirasi · ${m.L}-daraja</span><span class="lives" aria-label="${m.lives} ta jon">${hearts}</span></div></div>
    <div class="prompt" aria-live="polite">${prompt}</div>
    <div class="grid" style="--g:${c.g};--es:${c.g===3?42:c.g===4?32:26}px">${cells}</div>
    ${btn}
  </div>`;
}
function picTap(i){
  const m=mg;if(!m||m.kind!=='pics'||m.phase!=='ask')return;
  if(m.st[i])return;
  const t=m.order[m.ai];
  if(i===t.cell){m.st[i]='ok';m.bad=-1;SFX.tick();hap('tap')}
  else{m.st[t.cell]='miss';m.bad=i;m.mist++;SFX.bad();hap('bad')}
  m.ai++;
  if(m.ai>=m.c.k)return picsRoundEnd();
  renderPics();
}
function picsRoundEnd(){
  const m=mg;m.phase='fb';
  if(!m.mist){m.best=Math.max(m.best,m.L);m.next=false;
    m.msg=`<p style="color:var(--ok);font-weight:600">Barakalla! ${m.L}-daraja o'tildi</p><p class="muted">Keyingisida ${picCfg(m.L+1).k} ta rasm</p>`;
    renderPics();SFX.win();hap('ok');confetti(.45);
    m.tm.push(setTimeout(()=>{if(m.dead)return;m.L++;picsRound()},1500));
  }else{m.lives--;m.next=true;
    m.msg=m.lives<=0?`<p style="color:var(--bad);font-weight:600">Jonlar tugadi</p>`:`<p><b>${m.mist} ta xato.</b> Hechqisi yo'q — shu darajani yana bir bor!</p><p class="muted">Rasmlarni hikoya qilib bog'lab ko'ring.</p>`;
    renderPics();
  }
}
function picNext(){const m=mg;if(!m)return;if(m.lives<=0)return picsEnd();picsRound()}
function picsEnd(){
  const m=mg,score=m.best,prev=S.mem.pm;clearAll();enableClose(false);
  if(score>0){setFirst('pm',score);S.mem.pmn++;dayMax('pm',score)}
  const rec=score>prev;S.mem.pm=Math.max(prev,score);save(true);

    tip:rec?'':`Rekord: ${prev}-daraja. Har rasmni katak bilan bog'lab, kichik hikoya to'qib ko'ring — keyingi safar uzoqroq borasiz.`});
}
function renderMemResult(o){
  setScreen('result');
  const win=o.rec&&o.score>0;
  app.innerHTML=`<div class="wrap res">
    <div class="stack" style="margin-top:8px"><div class="kicker">${o.name}</div><h1 class="${win?'win':''}">${win?'Yangi rekord! 🎉':'Natija'}</h1></div>

function pairSetup(){
  const m=mg,c=m.c,it=shuffle(ITM.slice()).slice(0,c.n*2);
  m.pairs=Array.from({length:c.n},(_,i)=>({a:it[2*i],b:it[2*i+1]}));m.cardMs=c.s*1000;
  m.cards=m.pairs.map(p=>`<div class="mnc"><div class="em two"><span>${p.a[0]}</span><span class="plus">+</span><span>${p.b[0]}</span></div><div class="nm">${p.a[1]} + ${p.b[1]}</div>
    <div class="guide">💭 ${c.g?pick(PT)(p.a[1],p.b[1]):"Ikkalasini bitta g'alati sahnada tasavvur qiling"}</div></div>`);
  m.afterStudy=()=>{m.q=shuffle(m.pairs.slice());m.qi=0;m.tot=c.n;pairQ()};
  mnStudy();
}
function pairQ(){
  const m=mg,p=m.q[m.qi],k=m.c.o||4;
  let o=shuffle(m.pairs.filter(x=>x!==p).map(x=>x.b)).slice(0,k-1);
  while(o.length<k-1){const e=pick(ITM);if(!o.includes(e)&&!m.pairs.some(x=>x.a===e||x.b===e))o.push(e)}
  o=shuffle([p.b,...o]);
  choiceQ(`<div class="target">${p.a[0]}</div><p><b>${p.a[1]}</b> — juftini toping</p>`,o,o.indexOf(p.b),k===4?2:3,pairQ);
}

function numSetup(){const m=mg;m.isNum=1;m.R=3;m.r=0;m.sc=0;m.tot=3;m.need=2;m.best=0;numRound()}

/* ===== Miya statistikasi ===== */
const CHD={};
function lineChart(id,pts,o){
  if(pts.length<2)return `<p class="muted" style="font-size:14px">Grafik uchun kamida 2 kunlik mashq kerak.</p>`;
  const W=320,H=150,P={l:36,r:12,t:14,b:24},vs=pts.map(p=>p.v);
  let lo=o.min!=null?o.min:Math.min(...vs),hi=o.max!=null?o.max:Math.max(...vs);
  if(o.min==null){const pad=(hi-lo)*.2||1;lo=Math.max(0,lo-pad);hi=hi+pad}
  const X=i=>P.l+i/(pts.length-1)*(W-P.l-P.r),Y=v=>P.t+(1-(v-lo)/(hi-lo||1))*(H-P.t-P.b);
  const xs=pts.map((_,i)=>r1(X(i))),ys=pts.map(p=>r1(Y(p.v)));
  CHD[id]={pts,xs,ys,W,H,fmt:o.fmt};
  const ticks=[lo,(lo+hi)/2,hi];
  const grid=ticks.map(t=>`<line x1="${P.l}" x2="${W-P.r}" y1="${r1(Y(t))}" y2="${r1(Y(t))}" stroke="var(--line)" stroke-width="1" ${t===lo?'':'stroke-dasharray="2 4"'}/><text x="${P.l-6}" y="${r1(Y(t))+3}" text-anchor="end">${o.tick(t)}</text>`).join('');
  const path=xs.map((x,i)=>(i?'L':'M')+x+' '+ys[i]).join(' ');
  const last=pts.length-1;
  return `<div class="lastv">Oxirgi kun: <b>${o.fmt(pts[last].v)}</b></div><div class="chart" data-c="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.aria}">${grid}
    <text x="${xs[0]}" y="${H-6}" text-anchor="start">${pts[0].lab}</text><text x="${xs[last]}" y="${H-6}" text-anchor="end">${pts[last].lab}</text>
    <line class="xh" x1="0" x2="0" y1="${P.t}" y2="${H-P.b}" stroke="var(--muted)" stroke-width="1" opacity="0"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.length<=20?xs.map((x,i)=>`<circle cx="${x}" cy="${ys[i]}" r="3.5" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>`).join(''):''}
    <circle class="hl" cx="${xs[last]}" cy="${ys[last]}" r="5" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>
  </svg><div class="tt" hidden></div></div>`;
}
function chartHover(e){
  const ch=e.target.closest&&e.target.closest('.chart');if(!ch)return;const d=CHD[ch.dataset.c];if(!d)return;
  const svg=ch.querySelector('svg'),r=svg.getBoundingClientRect(),sx=(e.clientX-r.left)/r.width*d.W;
  let bi=0,bd=1e9;d.xs.forEach((x,i)=>{const dd=Math.abs(x-sx);if(dd<bd){bd=dd;bi=i}});
  const xh=ch.querySelector('.xh');xh.setAttribute('x1',d.xs[bi]);xh.setAttribute('x2',d.xs[bi]);xh.setAttribute('opacity','1');
  const hl=ch.querySelector('.hl');hl.setAttribute('cx',d.xs[bi]);hl.setAttribute('cy',d.ys[bi]);
  const tt=ch.querySelector('.tt');tt.hidden=false;tt.innerHTML=`<b>${d.fmt(d.pts[bi].v)}</b><span>${d.pts[bi].lab}${d.pts[bi].n?' · '+d.pts[bi].n+' ta savol':''}</span>`;
  const px=d.xs[bi]/d.W*r.width;tt.style.left=Math.min(Math.max(px,64),r.width-64)+'px';tt.style.top=(d.ys[bi]/d.H*r.height-10)+'px';
}
function chartLeave(e){const ch=e.target.closest&&e.target.closest('.chart');if(!ch||ch.contains(e.relatedTarget))return;const tt=ch.querySelector('.tt');if(tt)tt.hidden=true;const xh=ch.querySelector('.xh');if(xh)xh.setAttribute('opacity','0')}
function heatHtml(){
  const d=now(),dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow-7*11);const t=today();let h='';
  for(let i=0;i<84;i++){const k=ymd(d),x=S.days[k],n=x?(x.n||0)+(x.ds||x.pm||x.uf||x.qd||x.qe||x.mn?5:0):0;
    const l=k>t?'fut':n===0?'':n<10?'l1':n<30?'l2':n<60?'l3':'l4';
    h+=`<i class="${l}" title="${dm(k)}: ${x?x.n||0:0} ta savol"></i>`;d.setDate(d.getDate()+1)}
  return h;
}
function renderStats(){
  setScreen('stats');
  const M=metrics(),w=M.w;
  const fmtv=(x,v)=>v==null?'—':String(v).replace('.',',')+x.unit;
  const rows=M.m.map(x=>{
    const mx=Math.max(x.b,x.a||0)*1.1||1;
    const dl=x.d==null?'<span class="delta dn">—</span>':`<span class="delta ${x.d>0?'up':'dn'}">${x.d>0?'↑':x.d<0?'↓':'='} ${Math.abs(x.d)}%</span>`;
    return `<div class="mrow"><div class="mtop"><strong>${x.name}<small>${x.sub}</small></strong>${dl}</div>
      <div class="pair"><span>Boshida</span><div class="track"><i class="pb" style="width:${x.b/mx*100}%"></i></div><b>${fmtv(x,x.b)}</b></div>
      <div class="pair"><span>Hozir</span><div class="track">${x.a!=null?`<i class="pa" style="width:${x.a/mx*100}%"></i>`:''}</div><b>${fmtv(x,x.a)}</b></div></div>`;
  }).join('');
  const ks=w.ks.slice(-21);
  const accPts=ks.map(k=>({lab:dm(k),v:Math.round(S.days[k].c/S.days[k].n*100),n:S.days[k].n}));
  const spdPts=ks.map(k=>({lab:dm(k),v:r1(S.days[k].ts/S.days[k].n),n:S.days[k].n}));
  let topicRows='';
  if(w.recent){
    topicRows=TOPICS.map(tp=>{const b=w.base.tp[tp.id],a=w.recent.tp[tp.id];if(!b||!a||b[0]<5||a[0]<5)return'';
      const bv=Math.round(b[1]/b[0]*100),av=Math.round(a[1]/a[0]*100);
      return `<div class="mrow"><div class="mtop"><strong>${tp.name}</strong><span class="delta ${av>bv?'up':'dn'}">${sgn(av-bv)} p.p.</span></div>
        <div class="pair"><span>Boshida</span><div class="track"><i class="pb" style="width:${bv}%"></i></div><b>${bv}%</b></div>
        <div class="pair"><span>Hozir</span><div class="track"><i class="pa" style="width:${av}%"></i></div><b>${av}%</b></div></div>`}).join('');
  }
  const heroTxt=M.avg!=null?`<span class="kicker">O'rtacha o'sish</span><b class="${M.avg<0?'neg':''}">${sgn(M.avg)}%</b><p>${M.avg>0?"Miya mashqqa javob beryapti 💪 ":M.avg<0?"Ba'zan pasayish ham bo'ladi — qiyinroq darajalarga o'tganingiz uchun. Davom eting! ":''}Boshida: ${w.base.days.length?dm(w.base.days[0]):'—'}${w.recent?` · Hozir: oxirgi ${w.recent.days.length} kun`:''}</p>`
    :`<span class="kicker">Before / After</span><b class="neg" style="font-size:28px;letter-spacing:-.04em">Boshlang'ich nuqta</b><p>${w.base.n?`Siz ${w.base.n} ta savol yechdingiz — bu «Boshida» ko'rsatkichingiz. Taqqoslash uchun yana bir necha kun mashq qiling (kamida 30 ta savol).`:"Mashq qilishni boshlang: dastlabki natijalaringiz «Boshida» bo'ladi, keyingilari «Hozir» bilan taqqoslanadi."}</p>`;
  app.innerHTML=`<div class="wrap">
    <button class="back" data-act="home">← Orqaga</button>
    <div><div class="kicker">Before / After</div><h1 style="font:700 26px/1.15 var(--display);letter-spacing:-.04em;margin-top:8px">Miya statistikasi</h1></div>
    <div class="hero">${heroTxt}</div>
    ${rows?`<section class="card"><h2>Boshida va hozir</h2><div class="legend"><span><i style="background:var(--line)"></i>Boshida</span><span><i style="background:var(--accent)"></i>Hozir</span></div>${rows}</section>`:''}
    <section class="card"><h2>Aniqlik, kunlar bo'yicha</h2><p class="sub">to'g'ri javoblar, %</p>${lineChart('acc',accPts,{min:0,max:100,tick:t=>Math.round(t)+'%',fmt:v=>v+'%',aria:"Kunlik aniqlik grafigi"})}</section>
    <section class="card"><h2>Tezlik, kunlar bo'yicha</h2><p class="sub">soniya bir savolga · pastga tushsa — tezlashyapsiz</p>${lineChart('spd',spdPts,{tick:t=>r1(t).toString().replace('.',','),fmt:v=>String(v).replace('.',',')+' s',aria:'Kunlik tezlik grafigi'})}</section>
    ${topicRows?`<section class="card"><h2>Mavzular bo'yicha aniqlik</h2><div class="legend"><span><i style="background:var(--line)"></i>Boshida</span><span><i style="background:var(--accent)"></i>Hozir</span></div>${topicRows}</section>`:''}
    <section class="card"><h2>Faollik · 12 hafta</h2><div class="heat" role="img" aria-label="Oxirgi 12 haftadagi mashq kunlari">${heatHtml()}</div>
      <div class="legend"><span>kam</span><span><i style="background:var(--grid);border:1px solid var(--line)"></i><i style="background:var(--accent);opacity:.3"></i><i style="background:var(--accent);opacity:.55"></i><i style="background:var(--accent);opacity:.8"></i><i style="background:var(--accent)"></i></span><span>ko'p</span></div>
      <p class="sub" style="margin-top:0">Ketma-ket: ${curStreak()} kun · Faol kunlar: ${Object.keys(S.days).filter(actDay).length}</p></section>
    <p class="foot2">Bu ko'rsatkichlar shu ilovadagi mashqlardagi natijangiz. Ularning o'sishi hisob ko'nikmasi va ishchi xotira mashq qilinayotganini ko'rsatadi. «Boshida» — dastlabki faol kunlar, «Hozir» — oxirgi 7 kungacha bo'lgan faol kunlar.</p>
  </div>`;
  window.scrollTo(0,0);
}

/* ===== Zaxira nusxa ===== */
const exportCode=()=>btoa(unescape(encodeURIComponent(JSON.stringify(S))));
function renderBackup(){
  setScreen('backup');
  app.innerHTML=`<div class="wrap">
    <button class="back" data-act="home">← Orqaga</button>
    <div><div class="kicker">Sozlamalar</div><h1 style="font:700 26px/1.15 var(--display);letter-spacing:-.04em;margin-top:8px">Zaxira nusxa</h1></div>
    <p class="lead">Telegram'da natijalar avtomatik bulutga saqlanadi. Bu yerda qo'shimcha nusxa olishingiz yoki eski «aqliy-hisob.html» faylidagi natijalarni ko'chirishingiz mumkin.</p>
    <section class="ls"><h2>Nusxa olish</h2><textarea readonly id="exp" aria-label="Zaxira kodi">${exportCode()}</textarea><button class="secondary" data-act="copy">Kodni nusxalash</button><p id="cpmsg" class="muted" aria-live="polite"></p></section>
    <section class="ls"><h2>Tiklash yoki ko'chirish</h2><p class="muted" style="font-size:14px">Kodni yoki eski fayldagi JSON'ni shu yerga joylang. Natijalar hozirgilari bilan birlashtiriladi, hech narsa o'chmaydi.</p><textarea id="imp" placeholder="Kodni shu yerga joylang" aria-label="Tiklash kodi"></textarea><button class="primary" data-act="restore">Tiklash</button><p id="impmsg" class="muted" aria-live="polite"></p></section>
  </div>`;
}
function doRestore(){
  const raw=($('#imp').value||'').trim(),msg=$('#impmsg');if(!raw){msg.textContent='Avval kodni joylang.';return}
  let o=null;try{o=JSON.parse(raw)}catch(e){try{o=JSON.parse(decodeURIComponent(escape(atob(raw.replace(/\s/g,'')))))}catch(e2){}}
  if(!o||typeof o!=='object'||!o.t){msg.textContent="Kod noto'g'ri. Butunligicha nusxalanganini tekshiring.";return}
  const n=norm(o);n.epoch=S.epoch;S=norm(merge(S,n));save(true);msg.textContent='Tiklandi ✓ Natijalar birlashtirildi.';
}

/* ===== Hodisalar ===== */
app.addEventListener('mousedown',e=>{if(e.target.closest('.key,.del,.primary,.secondary,.cell,.choice'))e.preventDefault()});
app.addEventListener('pointermove',chartHover);
app.addEventListener('pointerdown',chartHover);
app.addEventListener('pointerout',chartLeave);
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(a==='chip'||a==='nextlevel'){intro={t:b.dataset.t,l:+b.dataset.l};renderIntro();window.scrollTo(0,0)}
  else if(a==='home')goHome();
  else if(a==='lesson'){lessonFrom=b.dataset.from;renderLesson(b.dataset.t)}
  else if(a==='backintro'){renderIntro();window.scrollTo(0,0)}
  else if(a==='start'){
    const tp=topicById(intro.t);
    startSession({kind:'level',topic:intro.t,topicName:tp.name,level:intro.l,total:10,challenge:intro.l>S.t[intro.t].u});
  }
  else if(a==='daily')startSession({kind:'daily',total:10});
  else if(a==='speed')startSession({kind:'speed',limit:60});
  else if(a==='retry')lastOpts&&lastOpts.kind==='review'?startReview():startSession(lastOpts);
  else if(a==='key')press(b.dataset.k);
  else if(a==='del')press('del');
  else if(a==='submit')submit();
  else if(a==='next')advance();
  else if(a==='exit')goHome();
  else if(a==='stats')renderStats();
  else if(a==='review'){clearAll();renderReview();window.scrollTo(0,0)}
  else if(a==='reviewgo')startReview();
  else if(a==='span')renderSpanIntro();
  else if(a==='spanstart')spanStart();
  else if(a==='skey')spanKey(b.dataset.k);
  else if(a==='spancheck')spanCheck();
  else if(a==='spannext')spanNext();
  else if(a==='pics')renderPicsIntro();
  else if(a==='picstart')picsStart();
  else if(a==='picready'){if(mg&&mg.phase==='show'){mg.phase='ask';renderPics()}}
  else if(a==='cell')picTap(+b.dataset.i);
  else if(a==='picnext')picNext();
  else if(a==='theme'){themePref={auto:'dark',dark:'light',light:'auto'}[themePref];try{localStorage.setItem('ah-theme',themePref)}catch(e){}applyTheme();renderHome()}
  else if(a==='qd')renderQdIntro();
  else if(a==='qdstart')qdStart();
  else if(a==='qdc')qdAnswer(+b.dataset.v);
  else if(a==='uf')renderUfIntro();
  else if(a==='mn'){renderMnIntro(b.dataset.g);window.scrollTo(0,0)}
  else if(a==='mnlv'){renderMnIntro(b.dataset.g,+b.dataset.l)}
  else if(a==='mngo')mnGo(mnSel.g,mnSel.l);
  else if(a==='mnlvgo')mnGo(b.dataset.g,+b.dataset.l);
  else if(a==='mnstep')mnStep();
  else if(a==='mno')mnOpt(+b.dataset.i);
  else if(a==='mnready'){if(mg&&mg.kind==='mn'&&mg.phase==='show'){mg.phase='input';renderMn()}}
  else if(a==='mkey')mnKey(b.dataset.k);
  else if(a==='mcheck')mnCheck();
  else if(a==='mcont')mnCont();
  else if(a==='ufstart')ufStart();
  else if(a==='ufc')ufC(+b.dataset.v);
  else if(a==='ufp')ufP(+b.dataset.i);
  else if(a==='sound'){snd=!snd;try{localStorage.setItem('ah-snd',snd?'1':'0')}catch(e){}renderHome();if(snd)SFX.ok()}
  else if(a==='backup')renderBackup();
  else if(a==='copy'){const t=$('#exp');t.select();const done=()=>{$('#cpmsg').textContent='Nusxalandi ✓'};
    if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(done,()=>{try{document.execCommand('copy');done()}catch(e){}});else{try{document.execCommand('copy');done()}catch(e){}}}
  else if(a==='restore')doRestore();
  else if(a==='reset'){confirmReset=true;renderHome()}
  else if(a==='resetno'){confirmReset=false;renderHome()}
  else if(a==='resetyes'){const ep=Date.now();S=fresh();S.epoch=ep;save(true);confirmReset=false;renderHome()}
});
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.target.closest&&e.target.closest('textarea'))return;
  const k=e.key;
  if(ses&&!ses.ended){
    if(/^\d$/.test(k)||k==='-'||k==='.'||k===','||k==='Backspace'){e.preventDefault();press(k==='Backspace'?'del':k)}
    else if(k==='Enter'){e.preventDefault();if(ses.state==='ask')submit();else if(ses.state==='fb'&&!ses.ok&&ses.kind!=='speed')advance()}
  }else if(mg&&mg.kind==='qd'){
    if(k==='ArrowLeft'||k==='ArrowUp'||k==='1'){e.preventDefault();qdAnswer(0)}else if(k==='ArrowRight'||k==='ArrowDown'||k==='2'){e.preventDefault();qdAnswer(1)}
  }else if(mg&&mg.kind==='mn'){
    if(mg.phase==='study'&&(k==='Enter'||k===' ')){e.preventDefault();mnStep()}
    else if(mg.phase==='show'&&(k==='Enter'||k===' ')){e.preventDefault();mg.phase='input';renderMn()}
    else if(mg.phase==='input'&&(/^\d$/.test(k)||k==='Backspace')){e.preventDefault();mnKey(k==='Backspace'?'del':k)}
    else if(mg.phase==='input'&&k==='Enter'){e.preventDefault();mnCheck()}
    else if(mg.phase==='fb'&&mg.isNum&&k==='Enter'){e.preventDefault();mnCont()}
  }else if(mg&&mg.kind==='uf'){
    if(mg.phase==='q1'&&(k==='1'||k==='2')){e.preventDefault();ufC(+k-1)}
  }else if(mg&&mg.kind==='span'){
    if(/^\d$/.test(k)||k==='Backspace'){e.preventDefault();spanKey(k==='Backspace'?'del':k)}
    else if(k==='Enter'){e.preventDefault();if(mg.phase==='input')spanCheck();else if(mg.phase==='fb'&&!mg.ok)spanNext()}
  }else if(k==='Enter'&&scr==='intro'&&$('[data-act="start"]')){e.preventDefault();$('[data-act="start"]').click()}
});
if(tgv('6.1'))try{TG.BackButton.onClick(()=>{if(scr==='lesson'&&lessonFrom==='intro')renderIntro();else goHome()})}catch(e){}

/* Sinov uchun ichki kirish (ilova ishiga ta'sir qilmaydi) */
window.__AH={get S(){return S},set S(v){S=v},get mg(){return mg},norm,merge,metrics,save,sync,cloudPush,cloudPull,setCS:c=>{CS=c},shift:n=>{dayShift=n},render:()=>renderHome()};

renderHome();
sync();
